plugins { id 'com.android.application' }
def cargoVersion = (rootProject.file('../Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def versionParts = (cargoVersion =~ /^(\d+)\.(\d+)\.(\d+)/)[0]
def androidVersionCode = versionParts[1].toInteger() * 1000000 + versionParts[2].toInteger() * 10000 + versionParts[3].toInteger() * 100 + (cargoVersion.contains('-') ? 1 : 99)
def signingPath = System.getenv('YOLOFORGE_ANDROID_KEYSTORE')
android {
    namespace 'dev.yoloforge.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.yoloforge.mobile'
        minSdk 26
        targetSdk 36
        versionCode androidVersionCode
        versionName cargoVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'RELEASE_CERTIFICATE', '"' + rootProject.file('release-certificate.sha256').text.trim() + '"'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('YOLOFORGE_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('YOLOFORGE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('YOLOFORGE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        if (signingPath) { signingConfig signingConfigs.release }
    } }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
