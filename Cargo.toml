[workspace]
members = ["spikes/opencode", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
factory-core = { path = "crates/factory-core" }
factory-protocol = { path = "crates/factory-protocol" }
factory-opencode = { path = "crates/factory-opencode" }
