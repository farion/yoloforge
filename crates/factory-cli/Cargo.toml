[package]
name = "factory-cli"
default-run = "yoloforge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "yoloforge"
path = "src/yoloforge.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
factory-core.workspace = true
factory-protocol = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tempfile = "3"
sha2 = "0.10"
