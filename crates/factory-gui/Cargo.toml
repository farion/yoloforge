[package]
name = "factory-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "yoloforge-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
factory-core.workspace = true
factory-platform.workspace = true
factory-client-core = { path = "../factory-client-core" }
factory-protocol = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio = { workspace = true, features = ["io-util"] }
url = "2"
egui = { version = "0.33", features = ["default_fonts"] }
egui_glow = "0.33"
sdl3 = { version = "=0.18.4", features = ["build-from-source-static"] }
webbrowser = "1"
egui_extras = { version = "0.33", features = ["image", "syntect"] }
egui_virtual_list = "0.9"
egui-phosphor = "0.11"
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify-rust = "4"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
sys-locale = "0.3"

[build-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { version = "0.9.5", default-features = false }
