name: Versioned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    tags: ['v*']
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Verify tag and manifest version agree
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p factoryd -p factory-runner -p factory-tui
      - name: Package binaries and deployment contract
        run: |
          mkdir -p dist/yoloforge
          cp target/release/{yoloforge,factory,factoryd,factory-runner} dist/yoloforge/
          cp -r deploy dist/yoloforge/
          cp scripts/factory-backup.py scripts/factory-connect.py docs/deployment.md LICENSE dist/yoloforge/
          tar -C dist -czf yoloforge-${RELEASE_TAG}-linux-${{ matrix.arch }}.tar.gz yoloforge
          sha256sum yoloforge-*.tar.gz > checksums-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            yoloforge-*.tar.gz
            checksums-${{ matrix.arch }}.txt
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          provenance: true
          sbom: true
      - name: Record immutable server image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 -c 'import json,os; json.dump({"version":os.environ["RELEASE_TAG"],"image":os.environ["IMAGE"]+"@"+os.environ["DIGEST"],"platform":"linux/amd64"},open("server-image.json","w"))'
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.json
  publish:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check checksums-x86_64.txt
          sha256sum --check checksums-aarch64.txt
          test -s server-image.json
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
