name: Versioned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    tags: ['v*']
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Verify tag and manifest version agree
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p factoryd -p factory-runner -p factory-tui
      - name: Package binaries and deployment contract
        run: |
          python3 scripts/package-release.py --kind server --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
          python3 scripts/package-release.py --kind tui --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
          python3 scripts/package-release.py --kind runner --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
      - name: Test the standalone server package
        if: matrix.arch == 'x86_64'
        run: python3 scripts/smoke-server-package.py "dist/yoloforge-server-${RELEASE_TAG}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  windows-tui:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo test --locked -p factory-tui --bin yoloforge
      - run: cargo build --release --locked -p factory-tui --bin yoloforge
      - run: python scripts/smoke-client.py target/release/yoloforge.exe
      - run: python scripts/package-release.py --kind tui --os windows --arch x86_64 --version "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tui
          path: |
            dist/*.zip
            dist/*.sha256
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          provenance: true
          sbom: true
      - name: Record immutable server image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 -c 'import json,os; json.dump({"version":os.environ["RELEASE_TAG"],"image":os.environ["IMAGE"]+"@"+os.environ["DIGEST"],"platform":"linux/amd64"},open("server-image.json","w"))'
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.json
  android:
    if: vars.ANDROID_RELEASE_SIGNING == 'enabled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify release version
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - name: Materialize private signing inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          os.umask(0o077)
          directory=Path(os.environ['RUNNER_TEMP'])/'yoloforge-signing'
          directory.mkdir()
          for key in ['KEYSTORE_BASE64','STORE_PASSWORD','KEY_ALIAS']:
              assert os.environ.get(key), 'Android signing secret missing: '+key
          (directory/'release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          (directory/'password').write_text(os.environ['STORE_PASSWORD'])
          (directory/'signing.json').write_text(json.dumps({'alias':os.environ['KEY_ALIAS'],'keystore':'release.p12','password_file':'password'}))
          PY
      - name: Build and verify pinned Android release signature
        run: python3 scripts/android-release.py --signing-dir "$RUNNER_TEMP/yoloforge-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/*.apk.sha256
      - name: Remove ephemeral signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/yoloforge-signing"
  publish:
    needs: [binaries, windows-tui, image, android]
    if: always() && needs.binaries.result == 'success' && needs.windows-tui.result == 'success' && needs.image.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-tui
          path: release
      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: android-release
          path: release
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          test -s server-image.json
          notes=(--generate-notes)
          if test -f "../docs/release-notes/${RELEASE_TAG}.md"; then
            notes=(--notes-file "../docs/release-notes/${RELEASE_TAG}.md")
          fi
          gh release create "$RELEASE_TAG" --verify-tag "${notes[@]}" --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
