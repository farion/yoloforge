name: Versioned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    tags: ['v*']
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Verify tag and manifest version agree
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p factoryd -p factory-runner -p factory-tui
      - name: Package binaries and deployment contract
        run: |
          python3 scripts/package-release.py --kind server --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
          python3 scripts/package-release.py --kind tui --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
          python3 scripts/package-release.py --kind runner --os linux --arch ${{ matrix.arch }} --version "$RELEASE_TAG"
      - name: Test the standalone server package
        if: matrix.arch == 'x86_64'
        run: python3 scripts/smoke-server-package.py "dist/yoloforge-server-${RELEASE_TAG}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  windows-tui:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo test --locked -p factory-tui --bin yoloforge
      - run: cargo build --release --locked -p factory-tui --bin yoloforge
      - run: python scripts/package-release.py --kind tui --os windows --arch x86_64 --version "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tui
          path: |
            dist/*.zip
            dist/*.sha256
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          provenance: true
          sbom: true
      - name: Record immutable server image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 -c 'import json,os; json.dump({"version":os.environ["RELEASE_TAG"],"image":os.environ["IMAGE"]+"@"+os.environ["DIGEST"],"platform":"linux/amd64"},open("server-image.json","w"))'
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.json
  publish:
    needs: [binaries, windows-tui, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-tui
          path: release
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          test -s server-image.json
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false --latest
