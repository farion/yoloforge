name: Android signing verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/android-release.py'
      - '.github/workflows/android-signing.yml'
permissions:
  contents: read
jobs:
  signed-apk:
    if: vars.ANDROID_RELEASE_SIGNING == 'enabled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Materialize private signing inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          os.umask(0o077)
          directory=Path(os.environ['RUNNER_TEMP'])/'yoloforge-signing'
          directory.mkdir()
          for key in ['KEYSTORE_BASE64','STORE_PASSWORD','KEY_ALIAS']:
              assert os.environ.get(key), 'Android signing secret missing: '+key
          (directory/'release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          (directory/'password').write_text(os.environ['STORE_PASSWORD'])
          (directory/'signing.json').write_text(json.dumps({'alias':os.environ['KEY_ALIAS'],'keystore':'release.p12','password_file':'password'}))
          PY
      - run: python3 scripts/android-release.py --signing-dir "$RUNNER_TEMP/yoloforge-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: yoloforge-android-signed-development
          path: |
            dist/*.apk
            dist/*.apk.sha256
      - name: Remove ephemeral signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/yoloforge-signing"
