name: Rust and process checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 -u scripts/smoke-foundation.py
      - run: python3 -u scripts/smoke-tui-answers.py
      - run: python3 -u scripts/smoke-backup.py
  windows-tui:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: cargo test --locked -p factory-tui --bin yoloforge
      - run: cargo build --locked -p factory-tui --bin yoloforge
