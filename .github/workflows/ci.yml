name: Rust and process checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
        working-directory: android
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: cargo build --locked -p factoryd
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./android/gradlew -p android :app:connectedDebugAndroidTest
            python3 scripts/smoke-android.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        with:
          name: yoloforge-android-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 -u scripts/smoke-foundation.py
      - run: python3 -u scripts/smoke-tui-answers.py
      - run: python3 -u scripts/smoke-backup.py
      - run: python3 -u scripts/smoke-archive-files.py
  windows-tui:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: cargo test --locked -p factory-tui --bin yoloforge
      - run: cargo build --locked -p factory-tui --bin yoloforge
      - run: python scripts/smoke-client.py target/debug/yoloforge.exe
